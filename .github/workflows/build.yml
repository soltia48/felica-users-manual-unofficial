name: Build LaTeX document
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
jobs:
  build_latex:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ja, en]
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v3
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            ${{ matrix.language }}/card_usersmanual.tex
          work_in_root_file_dir: true
          docker_image: texlive/texlive:latest-full
          latexmk_use_lualatex: true
      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: card_usersmanual-${{ matrix.language }}
          path: ${{ matrix.language }}/card_usersmanual.pdf

  release:
    needs: build_latex
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF files
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        run: |
          mkdir -p release
          for language in ja en; do
            cp "artifacts/card_usersmanual-${language}/card_usersmanual.pdf" \
               "release/card_usersmanual-${language}-${GITHUB_REF_NAME}.pdf"
          done
          ls -l release
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.pdf --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              release/*.pdf
          fi
